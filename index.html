<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU Online</title>
    <!-- R12.5: suprime o 404 de /favicon.ico no console físico (nenhum asset
         real do cliente é um favicon — política 0 fake: data-URI vazio). -->
    <link rel="icon" href="data:,">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            height: 100vh;
        }
        #game-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        .status-bar {
            position: fixed;
            bottom: 15px;
            right: 15px;
            color: #888;
            font-size: 11px;
            font-family: Consolas, monospace;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 6px 10px;
            border-radius: 4px;
        }
        /* Bootstrap técnico pré-assets. NÃO é o CLoadingScene do jogo.
           A arte real LSBg01..04 entra por scenes/LoadingScene.js. */
        #loading {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; color: #ccc; font-family: Consolas, monospace;
        }
        #loading .boot-status { font-size:12px; color:#aaa; margin-bottom:10px; }
        #loading .bar { width: 400px; height: 8px; background: #1a1a24; border-radius: 4px; overflow: hidden; margin: 12px 0; box-shadow: inset 0 0 8px #000; }
        #loading .bar-fill { height: 100%; width: 0%; background: #b8b8b8; transition: width 0.15s; border-radius: 4px; }
        #loading .progress-text { font-size: 12px; color: #888; min-height: 18px; margin: 8px 0; font-family: Consolas, monospace; }
        #loading .debug-console {
            width: 500px; max-height: 200px; overflow-y: auto;
            background: #000; border: 1px solid #333; border-radius: 4px;
            padding: 8px; font-family: Consolas, monospace; font-size: 10px;
            color: #8f8; text-align: left; margin-top: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #loading .debug-line { padding: 2px 0; border-bottom: 1px solid #111; white-space: pre-wrap; word-break: break-all; }
        #loading .debug-line.error { color: #f66; }
        #loading .debug-line.warn { color: #fa0; }
        #loading .debug-line.info { color: #8f8; }
        #loading .debug-line.asset { color: #8cf; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="boot-status">Inicializando cliente…</div>
        <div class="bar"><div class="bar-fill" id="loadBar"></div></div>
        <div class="progress-text" id="loadingText">Iniciando...</div>
        <div class="debug-console" id="debugConsole"></div>
    </div>

    <div id="game-canvas"></div>

    <div class="status-bar" id="statusText">Iniciando...</div>

    <script src="./runtime-config.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "./node_modules/three/build/three.module.js",
            "three/addons/": "./node_modules/three/examples/jsm/"
        }
    }
    </script>

    <script>
        // Debug console VISÍVEL na tela de loading
        const debugConsole = document.getElementById('debugConsole');
        const loadingText = document.getElementById('loadingText');
        const loadBar = document.getElementById('loadBar');
        const statusText = document.getElementById('statusText');

        function logDebug(type, msg) {
            const line = document.createElement('div');
            line.className = 'debug-line ' + type;
            const time = new Date().toLocaleTimeString();
            // Se for heartbeat, mostra mas não enche o console
            const isHeartbeat = msg.includes('heartbeat');
            line.textContent = `[${time}] [${type.toUpperCase()}] ${msg}`;
            if (isHeartbeat) line.style.opacity = '0.5';
            debugConsole.appendChild(line);
            debugConsole.scrollTop = debugConsole.scrollHeight;
            console.log(`[${type}] ${msg}`);
        }

        window.logDebug = logDebug;
        // FIX149: diagnostic ring buffer; does not intercept packets or alter rendering.
        const muDiagEntries = [];
        const muDiagCounts = new Map();
        const muDiagLimit = 1200;
        const muDiagOriginal = {log:console.log.bind(console),info:console.info.bind(console),warn:console.warn.bind(console),error:console.error.bind(console)};
        const muDiagString = value => {
            if (value instanceof Error) return value.stack || value.message;
            if (typeof value === 'string') return value;
            try { return JSON.stringify(value); } catch { return String(value); }
        };
        function muDiagClassify(message, level) {
            if (/\bslots is not defined\b|\bspatialClusters is not defined\b|_publishMapEntryProfile is not defined|World\d+.*FAIL|staged load FAIL/i.test(message)) return 'MAP_CRITICAL';
            if (/fetch-null:|body-load-failed:|equipamento ausente|BMD.*(?:ausente|failed)/i.test(message)) return 'MODEL_MISSING';
            if (/\[MOVE DIAG\]|prediction hard-timeout|MOVE R58/i.test(message)) return 'MOVEMENT_RECONCILE';
            if (/\[ItemIcon\]|\[PERF ITEM_ICON\]|\[Inventory\]/i.test(message)) return 'INVENTORY_RENDER';
            if (/OpenFolder|LuaAuthority|CharacterLuaFX|CustomCapeLua/i.test(message)) return 'LUA_OWNER';
            if (/envelope inválido|ECONNRESET|join recusado|MU Protocol.*Erro/i.test(message)) return 'NETWORK_PROTOCOL';
            if (/\[PERF|LOOP VIVO|FPS/i.test(message)) return 'PERFORMANCE';
            if (/\[ASSET|Carregando|World\d+/i.test(message)) return 'LOADING';
            return level === 'error' ? 'RUNTIME_ERROR' : level === 'warn' ? 'WARNING' : 'GENERAL';
        }
        function muDiagRecord(level, args) {
            const msg = args.map(muDiagString).join(' ');
            const category = muDiagClassify(msg,level);
            const signature = category + ':' + msg.replace(/\d+(?:\.\d+)?ms/g,'<ms>').slice(0,200);
            const count = (muDiagCounts.get(signature)||0)+1;
            muDiagCounts.set(signature,count);
            muDiagEntries.push({time:new Date().toISOString(),level,category,message:msg,repeat:count});
            if (muDiagEntries.length>muDiagLimit) muDiagEntries.shift();
        }
        for (const level of ['log','info','warn','error']) {
            console[level] = (...args) => {
                try { muDiagRecord(level,args); } catch (_) { /* diagnostic never blocks game */ }
                muDiagOriginal[level](...args);
            };
        }
        window.MUWEB_DIAG = Object.freeze({
            version:'FIX154',
            summary:() => {
                const category = {},severity={};
                for (const e of muDiagEntries) {category[e.category]=(category[e.category]||0)+1;severity[e.level]=(severity[e.level]||0)+1;}
                return {version:'FIX154',entries:muDiagEntries.length,category,severity,uniqueSignatures:muDiagCounts.size};
            },
            list:(category=null)=>muDiagEntries.filter(x=>!category||x.category===category).map(x=>({...x})),
            movement:()=>{
                const a=window.muApp;
                return {
                    serverTile:a?._heroServerTile || null,
                    latestCorrection:a?._lastMovementReconcile || null,
                    pending:a?._netMovePending ? {x:a._netMovePending.x,y:a._netMovePending.y,dir:a._netMovePending.dir,acked:a._netMovePending.acked} : null,
                    unacked:a?._netMoveUnacked?.map(q=>({x:q.x,y:q.y,ageMs:Math.max(0,Math.round(performance.now()-q.sentAt))})) || [],
                    rttMs:a?._netMoveRttEwmaMs || null,jitterMs:a?._netMoveJitterEwmaMs || null,
                    inventoryPaint:a?._ui?.inventoryWin?._lastPaintCounts || null,
                };
            },
            tile:(x,y)=>{
                const ix=Number(x),iy=Number(y),scene=window.muApp?.scene;
                if(!Number.isInteger(ix)||!Number.isInteger(iy)||ix<0||iy<0||ix>=256||iy>=256) return {valid:false,reason:'tile outside 0..255'};
                if(!scene?.walls) return {valid:false,reason:'ATT real not loaded'};
                const index=iy*256+ix,raw=Number(scene.walls[index]||0);
                const worldX=(ix+0.5)*100-12800,worldZ=12800-(iy+0.5)*100;
                return {valid:true,world:scene.mapIndex,tile:{x:ix,y:iy},flags:raw,
                    NO_MOVE:!!(raw&4),NO_GROUND:!!(raw&8),HEIGHT:!!(raw&64),
                    SAFE_ZONE:!!(raw&1),NO_ATTACK:!!(raw&256),
                    walkable:scene.isWalkable?.(worldX,worldZ)===true,
                    sampledHeight:scene.terrainHeightAt?.(worldX,worldZ)??null,
                    vertexHeight:scene.heights?.[index]??null};
            },
            // Read-only author-height inspection: bridge structures retain their
            // PC authored Z, not a synthetic terrain height. Report BOTH for
            // physical comparison without moving any vertex/model in runtime.
            viewportMissing:()=>window.muApp?.playerViewport?.missingEquipmentReport?.() || [],
            viewportPose:()=>window.muApp?.playerViewport?.poseCullingReport?.() || null,
            structures:()=>{
                const scene=window.muApp?.scene;
                const slots=scene?.worldObjectLayer?.instances || [];
                return slots.filter(s=>s?.obj && (s.obj.serial===80||s.obj.serial===85)).map(s=>({
                    object:s.obj.serial+1,sourceSerial:s.obj.serial,
                    muPosition:{x:s.obj.x,y:s.obj.y,z:s.obj.z},
                    authoredWorldY:s.outer?.position?.y??null,
                    worldX:s.outer?.position?.x??null,
                    worldZ:s.outer?.position?.z??null,
                    terrainHeight:s.outer?.position&&scene?.terrainHeightAt?.(s.outer.position.x,s.outer.position.z),
                    scale:s.obj.scale,
                    angles:[s.obj.angleX,s.obj.angleY,s.obj.angleZ],
                    renderer:!!s.renderer
                }));
            },
            companions:async()=>{
                const m=await import('./game/CompanionLoadQueue.js');
                return {hero:window.muApp?.pets?.companionDiagnostics?.() || [], remoteQueue:m.remoteCompanionQueue.snapshot()};
            },
            modelCoverage:async()=>{
                const m=await import('./data/ModelPortabilityAudit.js');
                return m.auditModelCoverage();
            },
            iconPipeline:async()=>{
                const m=await import('./ui2/ItemIconRenderer.js');
                return m.iconPipelineDiagnostics();
            },
            report:()=>JSON.stringify({
                timestamp:new Date().toISOString(),url:location.origin+location.pathname,
                summary:window.MUWEB_DIAG.summary(),
                runtime:{
                    source:window.muApp?.constructor?.name||null,
                    currentMap:window.muApp?.scene?.mapIndex??null,
                    appState:window.muApp?.sceneManager?.currentName??null,
                    movement:window.MUWEB_DIAG.movement(),
                    bridges:window.MUWEB_DIAG.structures(),
                    viewportMissing:window.MUWEB_DIAG.viewportMissing(),
                    viewportPose:window.MUWEB_DIAG.viewportPose(),

                },entries:muDiagEntries
            },null,2),
            download:async()=>{
                // Keep the synchronous report useful in the console, while the
                // downloadable snapshot additionally captures the icon queue.
                const base=JSON.parse(window.MUWEB_DIAG.report());
                try { base.runtime.iconPipeline=await window.MUWEB_DIAG.iconPipeline(); }
                catch(e) { base.runtime.iconPipelineError=String(e?.message||e); }
                try { base.runtime.companions=await window.MUWEB_DIAG.companions(); }
                catch(e) { base.runtime.companionsError=String(e?.message||e); }
                try { base.runtime.modelCoverage=await window.MUWEB_DIAG.modelCoverage(); }
                catch(e) { base.runtime.modelCoverageError=String(e?.message||e); }
                const blob=new Blob([JSON.stringify(base,null,2)],{type:'application/json'});
                const url=URL.createObjectURL(blob); const a=document.createElement('a');
                a.href=url;a.download='MUWEB_FIX154_diagnostic.json';a.click();
                setTimeout(()=>URL.revokeObjectURL(url),1000);
            }
        });
        muDiagOriginal.info('[MUWEB DIAG FIX154] Use MUWEB_DIAG.summary(), .movement(), .tile(x,y), .structures(), .viewportMissing(), .viewportPose(), .iconPipeline(), .companions(), .modelCoverage(), .download()');


        // Erros globais → console visível
        window.addEventListener('error', (e) => {
            logDebug('error', (e.filename ? e.filename + ':' + e.lineno + ':' + e.colno + ' ' : '') + (e.error?.stack || e.message || e.type));
        });
        window.addEventListener('unhandledrejection', (e) => {
            logDebug('error', 'Promise rejection: ' + (e.reason?.stack || e.reason?.message || e.reason));
        });

        // Bloqueia file://
        if (location.protocol === 'file:') {
            document.getElementById('loadingText').innerHTML =
                '❌ Abriu via file:// — ES modules não funcionam.<br><br>' +
                'Execute: <b>START-GAME.bat</b> e abra <b>http://localhost:8080</b>';
            document.getElementById('loadingText').style.cssText = 'color:#ff6666;font-size:14px;line-height:1.8;max-width:500px;padding:20px;text-align:center;';
        }

        function setProgress(percent, msg) {
            document.getElementById('loadBar').style.width = percent + '%';
            if (msg) logDebug('info', msg);
        }

        function setStatus(msg) {
            const s = document.getElementById('statusText');
            if (s) s.textContent = msg;
        }
    </script>
    <script type="module">
        import { GameApp } from './core/GameApp.js';

        const bar = document.getElementById('loadBar');
        const debugConsole = document.getElementById('debugConsole');

        // GameApp vai chamar window.onLoadingProgress(percent, message)
        // Null-safe: o overlay #loading é removido após o init — reportar
        // depois disso NÃO pode quebrar o fluxo do jogo (causava TypeError)
        window.onLoadingProgress = (percent, msg) => {
            const bar = document.getElementById('loadBar');
            if (bar && percent != null) bar.style.width = percent + '%';
            if (msg) {
                const dbg = document.getElementById('debugConsole');
                if (dbg) {
                    const line = document.createElement('div');
                    line.className = 'debug-line asset';
                    line.textContent = `[${new Date().toLocaleTimeString()}] [ASSET] ${msg}`;
                    dbg.appendChild(line);
                    dbg.scrollTop = dbg.scrollHeight;
                }
                console.log('[ASSET] ' + msg); // fallback pós-overlay
            }
        }

        const app = new GameApp('game-canvas');
        window.muApp = app; // handle de inspeção/debug (console: muApp.state, muApp.scene.terrain...)
        app.init().then(() => {
            logDebug('info', 'GameApp iniciado com sucesso!');
            const loading = document.getElementById('loading');
            loading.style.opacity = '0';
            setTimeout(() => loading.remove(), 500);
            // HUD de status é elemento de dev — some após o boot
            const st = document.getElementById('statusText');
            if (st) { st.style.transition = 'opacity .6s'; st.style.opacity = '0'; }
        }).catch(err => {
            const line = document.createElement('div');
            line.className = 'debug-line error';
            line.textContent = `[${new Date().toLocaleTimeString()}] [ERRO] ${err.message || err}`;
            document.getElementById('debugConsole').appendChild(line);
            document.getElementById('debugConsole').scrollTop = 9999;
            console.error(err);
        });

        window.GameApp = window.app = app;
    </script>
</body>
</html>
