name: Apply source update

on:
  push:
    paths:
      - '.source-update/READY'

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and apply source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .source-update/part*.txt > /tmp/source-update.b64
          base64 --decode /tmp/source-update.b64 > /tmp/source-update.patch.xz
          xz -dc /tmp/source-update.patch.xz > /tmp/source-update.patch
          git apply --check /tmp/source-update.patch
          git apply /tmp/source-update.patch

          # Public tree cleanup: remove temporary/import artifacts and obsolete launchers.
          rm -rf .source-update .source-upload docs/ENGINE
          rm -f INICIAR_ASSETS.bat INICIAR_GATEWAY.bat INICIAR_WEB.bat
          rm -f .github/workflows/apply-source-update.yml

      - name: Validate public tree
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f package.json
          test -f INICIAR_MUWEB.bat
          test -f INSTALAR_DEPENDENCIAS.bat
          test -f PARAR_MUWEB.bat
          test -f assets/BmdGeometryPool.js
          test -f world/PcIcarusVisualContract.js
          ! grep -RniE 'MUWEB_R90_FIX|HOTFIX|FIX[0-9]+' README.md docs core world graphics scenes ui ui2 assets tools 2>/dev/null

      - name: Commit public source update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Atualiza source pública do Projeto MuWeb"
          git push
