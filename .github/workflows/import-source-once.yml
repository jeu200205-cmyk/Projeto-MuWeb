name: Import source once

on:
  push:
    paths:
      - '.source-upload/READY'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source package
        shell: bash
        run: |
          set -euo pipefail
          cat .source-upload/chunk*.txt > /tmp/projeto-muweb.b64
          base64 --decode /tmp/projeto-muweb.b64 > /tmp/projeto-muweb.zip
          rm -rf /tmp/projeto-muweb
          mkdir -p /tmp/projeto-muweb
          unzip -q /tmp/projeto-muweb.zip -d /tmp/projeto-muweb
          test -f /tmp/projeto-muweb/Projeto-MuWeb-public/package.json
          test -f /tmp/projeto-muweb/Projeto-MuWeb-public/README.md

      - name: Replace repository with cleaned project source
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for p in * .*; do
            case "$p" in
              .|..|.git|.github|.source-upload) continue ;;
            esac
            rm -rf -- "$p"
          done
          cp -a /tmp/projeto-muweb/Projeto-MuWeb-public/. .
          rm -rf .source-upload
          rm -f .github/workflows/import-source-once.yml

      - name: Commit complete public source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "source: publish cleaned Main 5.2 web base"
          git push
